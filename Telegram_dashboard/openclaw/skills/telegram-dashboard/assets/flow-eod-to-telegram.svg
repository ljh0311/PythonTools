<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" aria-labelledby="title">
  <title>EOD to Telegram flow</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="200" rx="12" fill="#0f172a"/>
  <!-- Git / EOD -->
  <rect x="24" y="52" width="180" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="114" y="88" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Git + session</text>
  <text x="114" y="112" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="600">EOD markdown</text>
  <text x="114" y="132" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">docs/eod/eod-YYYY-MM-DD.md</text>
  <!-- Arrow 1 -->
  <line x1="210" y1="100" x2="268" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Dashboard API -->
  <rect x="276" y="52" width="168" height="96" rx="10" fill="#1e293b" stroke="#0d9488"/>
  <text x="360" y="88" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Telegram Dashboard</text>
  <text x="360" y="112" text-anchor="middle" fill="#14b8a6" font-family="system-ui,sans-serif" font-size="15" font-weight="600">POST /api/send</text>
  <text x="360" y="132" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">tdash.py send-eod</text>
  <!-- Arrow 2 -->
  <line x1="450" y1="100" x2="508" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Telegram -->
  <rect x="516" y="52" width="180" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
  <path d="M576 78c-8.8 0-16 5.4-16 12v1.8l-2.8 4.2h37.6l-2.8-4.2V90c0-6.6-7.2-12-16-12Z" stroke="#0d9488" stroke-width="1.5"/>
  <text x="606" y="118" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Telegram</text>
  <text x="606" y="136" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">operator inbox</text>
</svg>
