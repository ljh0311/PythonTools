<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Dashboard v2</title>
  <link rel="stylesheet" href="/v2/static/css/styles.css" />
</head>
<body>
  <div class="v2-shell">
    <header class="v2-header">
      <div class="v2-brand">
        <span class="v2-brand-mark" aria-hidden="true"></span>
        <div>
          <p class="v2-brand-title">Awareness</p>
          <p class="v2-brand-sub">Talk · Act · Profiles</p>
        </div>
      </div>
      <nav class="v2-nav" aria-label="Primary">
        <button type="button" class="v2-nav-btn is-active" data-view="talk" aria-current="page">Talk</button>
        <button type="button" class="v2-nav-btn" data-view="act">Act</button>
        <button type="button" class="v2-nav-btn" data-view="profiles">Profiles</button>
      </nav>
      <a class="v2-classic-link" href="/">Open classic dashboard</a>
    </header>

    <main class="v2-main">
      <section id="view-talk" class="v2-view is-visible" aria-label="Talk"></section>
      <section id="view-act" class="v2-view" aria-label="Act" hidden></section>
      <section id="view-profiles" class="v2-view" aria-label="Profiles" hidden></section>
    </main>

    <div id="v2-toast" class="v2-toast" hidden role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/v2/static/js/app.js"></script>
</body>
</html>
