modLoader="javafml"
loaderVersion="[47,)"

[[mods]]
modId="ollamamod"
version="${version}"
displayName="Ollama Mod"
# Client-only: the mod talks to a local Ollama server and registers only client
# commands, so servers must not reject a player for having it installed.
displayTest="IGNORE_ALL_VERSION"
description='''
A Minecraft mod that integrates with Ollama AI to provide in-game AI chat capabilities.
Players can interact with AI models through commands and GUI interfaces.
'''
authors="OllamaMod Team"
credits="Thanks to the Ollama team for the amazing AI platform"

[[dependencies.ollamamod]]
modId="forge"
mandatory=true
versionRange="[47.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.ollamamod]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.ollamamod]]
modId="architectury"
mandatory=true
versionRange="[9.1.10,)"
ordering="NONE"
side="BOTH"
