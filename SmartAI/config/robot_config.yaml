# Smart Robot Configuration File

# Network Settings (for future remote control)
network:
  host: "localhost"
  port: 8080
  enable_remote_control: false

# Named locations for tool-based navigation (cm)
locations:
  kitchen: [600, 400]
  bedroom: [200, 300]
  living_room: [500, 600]

# Vision fusion into navigation (not GUI-only)
vision:
  fusion_enabled: true
  model_path: "efficientdet.tflite"
  prediction_horizon: 2.0
  stop_time_to_collision: 1.0
  reroute_time_to_collision: 3.0
  camera_fov_deg: 60
  max_range_cm: 300

# Hardware transport backend: gpio | simulation | rpi
hardware:
  transport: gpio
  # Motor pins (for Raspberry Pi GPIO)
  left_motor:
    forward_pin: 17
    backward_pin: 18
    enable_pin: 27
    pwm_frequency: 1000
  
  right_motor:
    forward_pin: 22
    backward_pin: 23
    enable_pin: 24
    pwm_frequency: 1000
  
  # Sensor pins
  sensors:
    ultrasonic_front: 5
    ultrasonic_left: 6
    ultrasonic_right: 13
    infrared_left: 19
    infrared_right: 26
    bumper_left: 20
    bumper_right: 21
  
  # Camera settings
  camera:
    device_id: 0
    width: 640
    height: 480
    fps: 30

# Robot Physical Properties
robot:
  name: SmartAI
  model: llama3.1:8b
  # Dimensions (in cm)
  width: 30
  length: 40
  height: 20
  wheel_diameter: 6.5
  wheel_distance: 25
  
  # Movement parameters
  max_speed: 50  # cm/s
  min_speed: 10  # cm/s
  turn_speed: 30  # cm/s
  acceleration: 20  # cm/s²
  
  # Safety distances (in cm)
  safety_distances:
    critical: 15
    warning: 35
    comfortable: 50

# Navigation Settings
navigation:
  # Pathfinding
  grid_size: 10  # cm
  map_width: 1000  # cm
  map_height: 1000  # cm
  
  # Obstacle detection
  min_obstacle_distance: 15  # cm
  max_obstacle_distance: 400  # cm
  
  # Behavior
  exploration_mode: true
  return_to_base: true
  base_location: [500, 500]  # [x, y] in cm
  
  # Mapping
  update_frequency: 5  # Hz
  mapping_enabled: true

# Control Settings
control:
  # Manual control
  manual_speed_limit: 30  # cm/s
  joystick_deadzone: 0.1
  
  # Autonomous mode
  auto_mode_enabled: true
  emergency_stop_distance: 8  # cm
  
  # GUI settings
  gui_update_rate: 30  # Hz
  show_debug_info: true
  show_sensor_data: true

# Notifications (blocked path, user alerts)
notifications:
  enabled: true
  channels:
    log: true
    api: true
    tts: false
    gui_toast: false
  max_history: 50

# Logging and Debugging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_logs: true
  log_directory: "logs/"
  max_log_size: "10MB"
  backup_count: 5

# Smart home integrations (credentials via env or local secrets — do not commit real tokens)
integrations:
  smartthings:
    enabled: false
    mock_mode: true
    personal_access_token: ""  # PAT from https://account.smartthings.com/tokens
    api_base: "https://api.smartthings.com/v1"
    default_light_device_id: ""
  google_home:
    enabled: false
    mock_mode: true
    project_id: ""
    client_id: ""
    client_secret: ""
    refresh_token: ""
    default_device_id: ""
  mqtt:
    enabled: false
    host: localhost
    port: 1883
    topic_prefix: smartai